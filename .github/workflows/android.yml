# Builds the Mecca Books Android app (APK) online.
# Run it from the repo: Actions → "Build Android APK" → Run workflow.
# When it finishes, download "MeccaBooks-APK" from the bottom of the run page.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "config.js", "capacitor.config.json", "icons/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check Android tools (already on GitHub's build machines)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Prepare app files
        run: |
          npm install
          npm run www
          npx cap add android
          npx cap sync android

      - name: Allow the camera (barcode / QR scanner)
        run: |
          m=android/app/src/main/AndroidManifest.xml
          grep -q android.permission.CAMERA $m || sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>|' $m
          grep -q android.permission.CAMERA $m && echo "camera permission added"

      - name: Use the Mecca Books icon
        run: |
          res=android/app/src/main/res
          rm -rf $res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $res/mipmap-$d
            cp icons/android/mipmap-$d/ic_launcher.png $res/mipmap-$d/ic_launcher.png
            cp icons/android/mipmap-$d/ic_launcher.png $res/mipmap-$d/ic_launcher_round.png
            rm -f $res/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MeccaBooks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeccaBooks-APK
          path: MeccaBooks.apk
