<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mecca Books — The Security Mecca Accounting</title>
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0f1720; --panel:#17212b; --panel2:#1e2a37; --line:#2a3a4a;
    --txt:#e8eef4; --muted:#8aa0b4; --brand:#f5a623;
    --accent:#2d8cff; --good:#36c08a; --bad:#ff5d6c; --warn:#f5a623;
    --chip:#223240;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  button{font-family:inherit}
  a{color:var(--accent)}
  .app{display:flex;min-height:100vh}
  /* Sidebar */
  .side{width:230px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .2s}
  .brand{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  .brand b{color:var(--brand);font-size:17px;letter-spacing:.3px}
  .brand small{display:block;color:var(--muted);margin-top:2px;font-size:11px}
  .branchsel{margin:10px 12px;display:flex;gap:6px}
  .branchsel select{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
  .nav{flex:1;overflow:auto;padding:6px 8px}
  .nav .grp{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.8px;padding:12px 10px 4px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--txt);text-decoration:none;cursor:pointer;font-size:13.5px}
  .nav a .ic{width:18px;text-align:center;opacity:.9}
  .nav a:hover{background:var(--panel2)}
  .nav a.on{background:var(--chip);color:#fff}
  .whoami{padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}
  .whoami b{color:var(--txt)}
  /* Main */
  .main{flex:1;margin-left:230px;min-width:0}
  .top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,23,32,.9);backdrop-filter:blur(6px);z-index:30}
  .top h1{font-size:17px;margin:0;font-weight:600}
  .top .sp{flex:1}
  .burger{display:none;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;cursor:pointer}
  .content{padding:18px 22px 60px;max-width:1200px}
  /* bits */
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 13px;border-radius:8px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:#3a4d60}
  .btn.p{background:var(--brand);border-color:var(--brand);color:#1a1207;font-weight:600}
  .btn.p:hover{filter:brightness(1.05)}
  .btn.g{background:var(--good);border-color:var(--good);color:#06281c;font-weight:600}
  .btn.d{background:transparent;border-color:var(--bad);color:var(--bad)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h3{margin:0 0 12px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .l{color:var(--muted);font-size:12px}
  .kpi .v{font-size:23px;font-weight:700;margin-top:4px}
  .kpi .v.good{color:var(--good)} .kpi .v.bad{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:var(--panel2)}
  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .pill.q{background:#30425a;color:#aecbf0}
  .pill.inv{background:#2a4a3a;color:#8fe3bd}
  .pill.paid{background:#2a4a3a;color:#8fe3bd}
  .pill.due{background:#4a3a2a;color:#f0cfa0}
  .pill.over{background:#4a2a2a;color:#f0a0a0}
  input,select,textarea{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
  .f{margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .muted{color:var(--muted)}
  .right{text-align:right}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .search{max-width:260px}
  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:60;overflow:auto}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:720px;padding:20px}
  .modal.wide{max-width:960px}
  .modal h2{margin:0 0 16px;font-size:18px}
  .modal .close{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  .linetbl td{padding:5px 6px;border-bottom:1px solid var(--line)}
  .linetbl input,.linetbl select{padding:6px 7px}
  .totbox{margin-top:12px;margin-left:auto;max-width:300px}
  .totbox .tr{display:flex;justify-content:space-between;padding:4px 0}
  .totbox .tr.g{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;font-size:16px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .banner{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px}
  .status{position:fixed;bottom:14px;right:14px;background:var(--panel2);border:1px solid var(--line);padding:8px 13px;border-radius:999px;font-size:12px;z-index:50;display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--good)} .dot.off{background:var(--bad)}
  .toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#0b1118;border:1px solid var(--line);padding:11px 18px;border-radius:10px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  #authScreen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .authbox{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs .t{padding:7px 13px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:13px}
  .tabs .t.on{background:var(--chip);color:#fff;border-color:#3a4d60}
  .posgrid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
  .prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .prod{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;cursor:pointer;text-align:left}
  .prod:hover{border-color:var(--brand)}
  .prod .n{font-size:12.5px;font-weight:600;min-height:34px}
  .prod .p{color:var(--brand);font-weight:700;margin-top:6px}
  .pstack{margin-top:6px;display:flex;flex-direction:column;gap:2px;min-width:150px}
  .pstack .pl{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:2px 5px;border-radius:5px;color:var(--muted);cursor:pointer}
  .pstack .pl b{color:var(--txt);font-variant-numeric:tabular-nums}
  .pstack .pl.on{background:var(--chip);color:#fff}
  .pstack .pl.on b{color:var(--brand)}
  .pstack .pl.none{opacity:.45;cursor:default}
  .pstack .pl:not(.none):hover{background:var(--panel)}
  .prod .s{color:var(--muted);font-size:11px}
  .cart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:70px}
  .cartln{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
  .cartln .nm{flex:1;font-size:12.5px}
  .num{width:60px!important;text-align:right}
  @media(max-width:860px){
    .side{transform:translateX(-100%)}
    .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
    .main{margin-left:0}
    .burger{display:block}
    .grid2,.grid3{grid-template-columns:1fr}
    .posgrid{grid-template-columns:1fr}
    .content{padding:14px}
  }
</style>
</head>
<body>
<div id="authScreen" style="display:flex"><div class="authbox"><b style="color:var(--brand)">Mecca Books</b><p class="muted">Loading…</p></div></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <b>Mecca Books</b>
      <small>The Security Mecca · Accounting</small>
    </div>
    <div class="branchsel">
      <select id="branchSel" onchange="App.setBranch(this.value)"></select>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="whoami" id="whoami">Loading…</div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="sp"></div>
      <button class="btn p sm" onclick="App.quickAdd()">+ New</button>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="status"><span class="dot" id="syncDot"></span><span id="syncTxt">Starting…</span></div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
/* ============================================================
   MECCA BOOKS — original double-entry accounting for
   The Security Mecca (Richards Bay + Vereeniging)
   Data layer: shared cloud "db" capability (live sync, 30+ users,
   no licensing). Falls back to local storage when offline/solo.
   ============================================================ */
"use strict";

const VAT_RATE = 0.15;
const COLLECTIONS = ["accounts","customers","suppliers","items","documents",
  "journals","payments","projects","banktxns","bankrules","cashups","settings","counters","transfers","access","people"];
const AUDIT_SKIP = new Set(["counters","audit","people"]);

/* ---------- money helpers ---------- */
const money = n => (Math.round((+n||0)*100)/100);
const fmt = n => (money(n)<0?"-":"") + "R " + Math.abs(money(n)).toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtn = n => money(n).toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================
   STORE — abstracts the cloud db / local fallback
   ============================================================ */
const CFG = window.MB_CONFIG || {};
const SHARED_COLLS = new Set(["items","settings","projects","transfers"]);   // visible to both branches
const toEmail = u => { u=String(u||"").trim().toLowerCase(); return u.includes("@") ? u : u+"@"+(CFG.emailDomain||"staff.secmec.co.za"); };
const normUser = u => String(u||"").trim().toLowerCase().replace(/\s+/g,".");
function niceErr(e){
  const m=(e&&(e.message||e.error_description||e.msg))||String(e||"");
  if(/row-level security|violates|permission denied/i.test(m)) return "you don't have the right to do that";
  if(/right to change prices/i.test(m)) return "you don't have the right to change prices or costs";
  if(/Invalid login credentials/i.test(m)) return "wrong username or password";
  if(/Database error saving new user|invitation only/i.test(m)) return "there's no invitation for that username";
  if(/already registered|already exists|duplicate key/i.test(m)) return "that username is already taken";
  if(/Failed to fetch|NetworkError|network/i.test(m)) return "no internet connection";
  return m;
}

const Store = {
  sb:null, uid:null, profile:null, profiles:{}, invites:[], chan:null,
  _loaded:new Set(), _snap:{}, listeners:[],
  data:Object.fromEntries([...COLLECTIONS,"audit"].map(c=>[c,{}])),   // {coll:{id:obj}}
  _keep(coll,id,v){ (this._snap[coll]=this._snap[coll]||{})[id]= v==null?undefined:JSON.parse(JSON.stringify(v)); },

  client(){
    if(!this.sb) this.sb = window.supabase.createClient(CFG.url, CFG.anonKey,
      {auth:{persistSession:true, autoRefreshToken:true, storageKey:"meccabooks-auth"}});
    return this.sb;
  },

  // after sign-in: who am I, what may I see, load it, keep it live
  async start(){
    const { data:{ user } } = await this.client().auth.getUser();
    if(!user) throw new Error("not signed in");
    this.uid=user.id;
    await this.loadProfiles();
    if(this.profile && this.profile.active) {
      await this.loadAll();
      this.subscribe();
      this.client().rpc("touch").then(()=>{},()=>{});
    }
  },
  async loadProfiles(){
    const { data, error } = await this.client().from("profiles").select("*");
    if(!error){ this.profiles={}; (data||[]).forEach(p=>this.profiles[p.id]=p); }
    this.profile=this.profiles[this.uid]||null;
    if(can("users")){ const r=await this.client().from("invites").select("*"); this.invites=(r&&r.data)||[]; }
    this._loaded.add("access");
  },
  _row2obj(r){
    const o=Object.assign({}, r.data||{});
    o.id=r.id; if(r.branch && !o.branch) o.branch=r.branch;
    o._createdBy=r.created_by; o._createdAt=Date.parse(r.created_at)||null;
    o._by=r.updated_by; o._at=Date.parse(r.updated_at)||null;
    return o;
  },
  async loadAll(){
    setStatus(false,"Loading…");
    const sb=this.client(); const fresh=Object.fromEntries(COLLECTIONS.map(c=>[c,{}]));
    for(let from=0;;from+=1000){
      const { data, error } = await sb.from("docs").select("*").order("coll").order("id").range(from, from+999);
      if(error){ toast("Couldn't load data: "+niceErr(error)); break; }
      (data||[]).forEach(r=>{ (fresh[r.coll]=fresh[r.coll]||{})[r.id]=this._row2obj(r); });
      if(!data || data.length<1000) break;
    }
    for(const c of Object.keys(fresh)){
      this.data[c]=fresh[c]; this._snap[c]={};
      Object.entries(fresh[c]).forEach(([id,v])=>this._keep(c,id,v)); this._loaded.add(c);
    }
    setStatus(true,"Live · synced");
    this._emit();
  },
  subscribe(){
    const sb=this.client();
    if(this.chan) sb.removeChannel(this.chan);
    this.chan = sb.channel("meccabooks-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"docs"}, p=>{
        if(p.eventType==="DELETE"){ const o=p.old||{}; if(o.coll && this.data[o.coll]){ delete this.data[o.coll][o.id]; this._keep(o.coll,o.id,null); } }
        else { const r=p.new; if(!r||!r.coll) return; const o=this._row2obj(r);
               (this.data[r.coll]=this.data[r.coll]||{})[r.id]=o; this._keep(r.coll,r.id,o); }
        this._emitSoon();
      })
      .on("postgres_changes",{event:"*",schema:"public",table:"profiles"}, ()=>{ this.loadProfiles().then(()=>this._emitSoon()); })
      .subscribe(st=>{
        if(st==="SUBSCRIBED") setStatus(true,"Live · synced");
        else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED") setStatus(false,"Reconnecting…");
      });
    // after the phone wakes up / the PC comes back online, catch up on anything missed
    if(!this._wakeHooked){ this._wakeHooked=true;
      const resync=()=>{ if(document.visibilityState==="visible" && this.profile) this.loadAll(); };
      document.addEventListener("visibilitychange",resync); window.addEventListener("online",resync); }
  },
  async loadAudit(){
    const { data, error } = await this.client().from("audit").select("*").order("at",{ascending:false}).limit(1000);
    if(error){ toast("Couldn't load audit trail: "+niceErr(error)); return; }
    const map={}; (data||[]).forEach(r=>{ map[r.id]={id:r.id,at:Date.parse(r.at),by:r.by,action:r.action,coll:r.coll,docId:r.doc_id,
      branch:r.branch||"",label:r.label,amount:r.amount!=null?+r.amount:null,changed:r.changed||[]}; });
    this.data.audit=map; this._loaded.add("audit"); this._emit();
  },

  all(coll){ return Object.values(this.data[coll]||{}); },
  get(coll,id){ return (this.data[coll]||{})[id]||null; },
  _clean(obj){ const o=JSON.parse(JSON.stringify(obj)); for(const k of ["_by","_at","_createdBy","_createdAt"]) delete o[k]; return o; },

  async put(coll,obj){
    if(!obj.id) obj.id=uid();
    const existed=!!(this._snap[coll]&&this._snap[coll][obj.id]);
    const shared=SHARED_COLLS.has(coll);
    if(!shared && !obj.branch) obj.branch=recBranch(obj);
    const branch = shared ? null : obj.branch;
    obj._by=this.uid; obj._at=Date.now();
    if(!existed){ obj._createdBy=this.uid; obj._createdAt=obj._at; }
    this.data[coll][obj.id]=obj; this._emit();                 // show it straight away
    const sb=this.client(), data=this._clean(obj);
    const res = existed
      ? await sb.from("docs").update({branch,data}).match({coll,id:obj.id}).select("id")
      : await sb.from("docs").insert({coll,id:obj.id,branch,data}).select("id");
    if(res.error || !res.data || !res.data.length){
      const prev=this._snap[coll]&&this._snap[coll][obj.id];      // undo on screen
      if(prev) this.data[coll][obj.id]=JSON.parse(JSON.stringify(prev)); else delete this.data[coll][obj.id];
      this._emit();
      const msg="Not saved — "+(res.error?niceErr(res.error):"you don't have the right to do that");
      toast(msg); throw new Error(msg);
    }
    this._keep(coll,obj.id,obj);
    return obj;
  },
  async del(coll,id){
    if(!can("delete")){ toast("You don't have permission to delete"); return false; }
    const { data, error } = await this.client().from("docs").delete().match({coll,id}).select("id");
    if(error || !data || !data.length){ toast("Not deleted — "+(error?niceErr(error):"you don't have the right to do that")); return false; }
    delete this.data[coll][id]; this._keep(coll,id,null); this._emit();
    return true;
  },
  onChange(fn){ this.listeners.push(fn); },
  _emit(){ this.listeners.forEach(f=>{try{f();}catch(e){console.error(e);}}); },
  _emitSoon(){ clearTimeout(this._et); this._et=setTimeout(()=>this._emit(),150); }
};

/* ============================================================
   CHART OF ACCOUNTS (standard SA small-business set)
   ============================================================ */
/* Each branch keeps its OWN chart of accounts (separate books).
   Account docs: id "<BRANCH>_<code>", field branch:"RB"|"VV".
   Journals carry j.branch and post to that branch's chart. */
const STD_ACCOUNTS = [
  // code, name, type  (Asset, Liability, Equity, Income, Expense)
  ["1000","Bank — Current","Asset"],
  ["1050","Cash on Hand / Till","Asset"],
  ["1100","Debtors Control (Accounts Receivable)","Asset"],
  ["1200","Inventory / Stock on Hand","Asset"],
  ["1400","VAT Input (Control)","Asset"],
  ["1500","Equipment & Tools","Asset"],
  ["2000","Creditors Control (Accounts Payable)","Liability"],
  ["2100","VAT Output (Control)","Liability"],
  ["2900","Inter-branch Current Account","Liability"],
  ["3000","Owner's Capital","Equity"],
  ["3100","Retained Income","Equity"],
  ["3200","Drawings","Equity"],
  ["4000","Sales — Invoiced","Income"],
  ["4100","Sales — POS / Counter","Income"],
  ["4900","Other Income","Income"],
  ["5000","Cost of Sales","Expense"],
  ["6000","Rent","Expense"],
  ["6050","Salaries & Wages","Expense"],
  ["6100","Bank Charges","Expense"],
  ["6150","Telephone & Internet","Expense"],
  ["6200","Electricity & Water","Expense"],
  ["6250","Vehicle & Fuel","Expense"],
  ["6300","Repairs & Maintenance","Expense"],
  ["6350","Stationery & Printing","Expense"],
  ["6400","Marketing & Advertising","Expense"],
  ["6900","Sundry Expenses","Expense"]
];
// quick lookup of control accounts by code
const ACC = {
  bank:"1000", till:"1050", debtors:"1100", stock:"1200",
  vatIn:"1400", creditors:"2000", vatOut:"2100", interBranch:"2900", salesInv:"4000", salesPOS:"4100",
  cos:"5000"
};
const normalSide = type => (type==="Asset"||type==="Expense")?"D":"C";

/* ---- branch helpers ---- */
const recBranch = r => (r && r.branch) || "RB";           // legacy records = Richards Bay
const inBranch  = (r,b) => recBranch(r) === (b||App.branch);
const branchAccounts = b => Store.all("accounts").filter(a=>inBranch(a,b||App.branch));
const Company = b => Store.get("settings","company_"+(b||App.branch))
                   || ((b||App.branch)==="RB" ? Store.get("settings","company") : null) || {};

/* ============================================================
   LEDGER — derive balances from journals (per branch, or "ALL")
   ============================================================ */
const Ledger = {
  accByCode(code,b){ return branchAccounts(b).find(a=>a.code===code)
                      || Store.all("accounts").find(a=>a.code===code) || null; },
  // returns {code:{debit,credit,balance,type,name}}; scope = "RB" | "VV" | "ALL" (default current branch)
  trialBalance(filter,scope){
    scope=scope||App.branch;
    const accs={};
    const src = scope==="ALL" ? Store.all("accounts") : branchAccounts(scope);
    src.forEach(a=>{ if(!accs[a.code]) accs[a.code]={code:a.code,name:a.name,type:a.type,debit:0,credit:0}; });
    Store.all("journals").forEach(j=>{
      if(scope!=="ALL" && !inBranch(j,scope)) return;
      if(filter && !filter(j)) return;
      (j.lines||[]).forEach(l=>{
        if(!accs[l.account]) accs[l.account]={code:l.account,name:l.account,type:"?",debit:0,credit:0};
        accs[l.account].debit += money(l.debit||0);
        accs[l.account].credit += money(l.credit||0);
      });
    });
    Object.values(accs).forEach(a=>{ a.balance = money(a.debit - a.credit); });
    return accs;
  },
  accountBalance(code,filter,scope){ const a=this.trialBalance(filter,scope)[code]; return a?a.balance:0; },
  // customer / supplier sub-ledger balance in this branch's books
  partyBalance(kind,id,scope){
    scope=scope||App.branch;
    let bal=0;
    Store.all("journals").forEach(j=>{
      if(scope!=="ALL" && !inBranch(j,scope)) return;
      if(j.party && j.party.kind===kind && j.party.id===id){
        (j.lines||[]).forEach(l=>{
          const ctrl = kind==="customer"?ACC.debtors:ACC.creditors;
          if(l.account===ctrl) bal += money((l.debit||0)-(l.credit||0));
        });
      }
    });
    return kind==="customer"?bal:-bal; // supplier balance shown positive = we owe
  }
};

/* ============================================================
   POSTING — create balanced journals
   ============================================================ */
const Post = {
  // check a branch's chart has every account a posting needs, BEFORE anything is written
  ensure(branch,codes){
    branch=branch||App.branch;
    if(!branchAccounts(branch).length){ toast(App.branches[branch]+" books aren't set up yet — open Chart of Accounts"); return false; }
    const chart=new Set(branchAccounts(branch).map(a=>a.code));
    const missing=[...new Set(codes.filter(c=>c&&!chart.has(c)))];
    if(missing.length){ toast("Account "+missing.join(", ")+" is missing from the "+App.branches[branch]+" chart"); return false; }
    return true;
  },
  async journal(j){
    const D=money((j.lines||[]).reduce((s,l)=>s+(+l.debit||0),0));
    const C=money((j.lines||[]).reduce((s,l)=>s+(+l.credit||0),0));
    if(Math.abs(D-C)>0.009){ toast("Journal not balanced ("+fmt(D)+" vs "+fmt(C)+")"); throw new Error("unbalanced"); }
    j.id=j.id||uid();
    j.branch=j.branch||App.branch;
    const chart=new Set(branchAccounts(j.branch).map(a=>a.code));
    const missing=[...new Set((j.lines||[]).map(l=>l.account).filter(c=>!chart.has(c)))];
    if(missing.length){ toast("Account "+missing.join(", ")+" isn't in the "+App.branches[j.branch]+" chart — add it there first"); throw new Error("missing account"); }
    j.date=j.date||today();
    return Store.put("journals",j);
  }
};

async function nextNo(key,prefix,pad,branch){

/* ---- stock per branch: item.stock = {RB:n, VV:n} (legacy item.qty = Richards Bay) ---- */
function stockOf(it){ return it.stock ? it.stock : {RB:+it.qty||0}; }
function qtyOf(it,b){ b=b||App.branch; const s=stockOf(it);
  return b==="ALL" ? Object.keys(App.branches).reduce((x,k)=>x+(+s[k]||0),0) : (+s[b]||0); }
function addQty(it,b,d){ const s={...stockOf(it)}; s[b]=Math.round(((+s[b]||0)+d)*1000)/1000; it.stock=s; delete it.qty; }

/* ---- 6 PRICE LEVELS: Trade, Special, Retail + 3 own labels ----
   item.pcts[6]  = % per level (margin or markup, see Setup)
   item.prices[6]= selling price excl VAT per level (derived from cost + %) */
const DEF_LABELS=["Trade","Special","Retail","Self label 1","Self label 2","Self label 3"];
const DEF_PCTS=[20,35,40,null,null,null];
function Pricing(){ const s=Store.get("settings","pricing")||{};
  return {labels:(s.labels&&s.labels.length===6)?s.labels:DEF_LABELS, pcts:(s.pcts&&s.pcts.length===6)?s.pcts:DEF_PCTS,
          basis:s.basis||"margin", posLevel:s.posLevel!=null?+s.posLevel:0, custLevel:s.custLevel!=null?+s.custLevel:0}; }
const isNum = v => v!==null && v!=="" && v!==undefined && !isNaN(+v);
function priceFrom(cost,pct,basis){
  if(!isNum(pct)) return null; cost=+cost||0; pct=+pct;
  if((basis||Pricing().basis)==="margin"){ if(pct>=100) return null; return money(cost/(1-pct/100)); }
  return money(cost*(1+pct/100));
}
function pctFrom(cost,price,basis){
  cost=+cost||0; price=+price||0; if(!cost||!price) return null;
  return (basis||Pricing().basis)==="margin" ? Math.round((1-cost/price)*10000)/100 : Math.round((price/cost-1)*10000)/100;
}
function pricesOf(it){ if(Array.isArray(it.prices)) return it.prices.slice(0,6).concat(Array(6).fill(null)).slice(0,6);
  const a=Array(6).fill(null); if(isNum(it.price)) a[0]=+it.price; return a; }
function priceOf(it,l){ const v=pricesOf(it)[l||0]; return isNum(v)?+v:null; }
function pctsOf(it){ return Array.isArray(it.pcts) ? it.pcts.slice(0,6).concat(Array(6).fill(null)).slice(0,6) : Pricing().pcts.slice(); }
// recompute every level that has a % from the item's cost
function repriceItem(it){
  const b=Pricing().basis, pc=pctsOf(it), pr=pricesOf(it).slice();
  pc.forEach((x,l)=>{ const v=priceFrom(it.cost,x,b); if(v!=null) pr[l]=v; });
  it.pcts=pc; it.prices=pr; it.price=pr[0]; delete it.markup;
  return it;
}

  /* ---- Cash-up ---- */
  cashup(){
    const list=Store.all("cashups").filter(c=>inScope(c)).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    // today's expected till movement
    const js=Store.all("journals").filter(j=>inBranch(j) && j.date===today());
    let cashIn=0,cashOut=0;
    js.forEach(j=>(j.lines||[]).forEach(l=>{ if(l.account===ACC.till){ cashIn+=money(l.debit||0); cashOut+=money(l.credit||0); }}));
    const expected=money(cashIn-cashOut);
    return `
    <div class="banner">Daily cash-up reconciles the physical cash in your till against what the system recorded for <b>${App.branches[App.branch]}</b> today.</div>
    <div class="card">
      <h3>Today — ${today()}</h3>
      <div class="totbox" style="max-width:none;margin:0 0 12px">
        <div class="tr"><span>Cash received into till today</span><b>${fmt(cashIn)}</b></div>
        <div class="tr"><span>Cash paid out of till today</span><b>${fmt(cashOut)}</b></div>
        <div class="tr g"><span>Expected cash in till</span><b>${fmt(expected)}</b></div>
      </div>
      <button class="btn p" onclick="Forms.cashup(${expected})">Count & close cash-up</button>
    </div>
    <div class="card"><h3>Previous cash-ups — ${scopeName()}</h3>${Views._scopeSel()}

      <td class="r" style="color:${Math.abs(c.variance)<0.01?'var(--good)':(c.variance<0?'var(--bad)':'var(--warn)')}">${fmt(c.variance)}</td><td>${esc(c.note||"")}</td></tr>`).join("")}

    </div>`;

          ${!can("seeCost")?"":Object.entries(App.branches).filter(([k])=>can("br_"+k)).map(([k,v])=>{const x=Views._projPnl(p.id,k);return `<div class="tr muted" style="font-size:12px"><span>${v}</span><span>${fmt(x.income)} in · ${fmt(x.cost)} out · <b>${fmt(x.profit)}</b></span></div>`;}).join("")}

      </div>`;}).join("")}</div>`:`<div class="empty">No projects yet. Link invoices, bills and payments to a project to track its profit.</div>`}`;

  _projPnl(pid,b){

    Store.all("journals").forEach(j=>{ if(j.projectId!==pid) return; if(b && !inBranch(j,b)) return;

    return {income,cost,profit:money(income-cost)};

      ${can("seeCost")?`<tr style="font-weight:700"><td></td><td>Total</td><td colspan="${2+br.length+1}"></td><td class="r">${fmt(totVal)}</td><td></td></tr>`:""}
    </tbody></table></div>`:`<div class="empty">No stock items yet.</div>`}`+Views._transfers();

  /* ---- VAT report ---- */
  vat(){
    const sc=App.rscope||App.branch;
    const out=-Ledger.accountBalance(ACC.vatOut,null,sc), inp=Ledger.accountBalance(ACC.vatIn,null,sc);
    const net=money(out-inp);
    const vno = sc==="ALL" ? Object.keys(App.branches).map(b=>App.branches[b]+": "+(Company(b).vat||"—")).join(" · ") : (Company(sc).vat||"not set — add it under Setup");

  _scopeSel(){

    const note = sc===App.branch ? "" : `<span class="muted" style="font-size:12px">Viewing ${sc==="ALL"?"both branches":App.branches[sc]} · new entries still go to <b>${App.branches[App.branch]}</b></span>`;

      ${o.map(([k,v])=>`<option value="${k}" ${sc===k?"selected":""}>${v}</option>`).join("")}</select>${note}</div>`;
  },

  /* ---- Financial reports ---- */
  reports(){
    const sc=App.rscope||App.branch;
    const tb=Ledger.trialBalance(null,sc);
    const by=t=>Object.values(tb).filter(a=>a.type===t).sort((a,b)=>a.code.localeCompare(b.code));
    const sum=t=>money(by(t).reduce((s,a)=>s+a.balance,0));
    const income=-sum("Income"), expense=sum("Expense"), profit=money(income-expense);
    const totD=money(Object.values(tb).reduce((s,a)=>s+(a.balance>0?a.balance:0),0));
    const totC=money(Object.values(tb).reduce((s,a)=>s+(a.balance<0?-a.balance:0),0));
    const line=a=>`<tr><td>${a.code}</td><td>${esc(a.name)}</td><td class="r">${a.balance>0?fmtn(a.balance):""}</td><td class="r">${a.balance<0?fmtn(-a.balance):""}</td></tr>`;
    return Views._scopeSel()+`<div class="tabs">
      <div class="t on" onclick="Views._rtab(this,'tb')">Trial Balance</div>
      <div class="t" onclick="Views._rtab(this,'is')">Income Statement</div>
      <div class="t" onclick="Views._rtab(this,'bs')">Balance Sheet</div>
    </div>
    <div id="tb" class="rpane">
      <div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Account</th><th class="r">Debit</th><th class="r">Credit</th></tr></thead><tbody>
      ${Object.values(tb).sort((a,b)=>a.code.localeCompare(b.code)).map(line).join("")}
      <tr style="font-weight:700"><td></td><td>TOTAL</td><td class="r">${fmtn(totD)}</td><td class="r">${fmtn(totC)}</td></tr>
      </tbody></table></div>
    </div>
    <div id="is" class="rpane" style="display:none">
      <div class="card"><h3>Income</h3><table>${by("Income").map(a=>`<tr><td>${esc(a.name)}</td><td class="r">${fmt(-a.balance)}</td></tr>`).join("")}
        <tr style="font-weight:700"><td>Total income</td><td class="r">${fmt(income)}</td></tr></table></div>
      <div class="card"><h3>Expenses</h3><table>${by("Expense").map(a=>`<tr><td>${esc(a.name)}</td><td class="r">${fmt(a.balance)}</td></tr>`).join("")}
        <tr style="font-weight:700"><td>Total expenses</td><td class="r">${fmt(expense)}</td></tr></table></div>
      <div class="kpi"><div class="l">Net profit</div><div class="v ${profit>=0?'good':'bad'}">${fmt(profit)}</div></div>
    </div>
    <div id="bs" class="rpane" style="display:none">
      <div class="card"><h3>Assets</h3><table>${by("Asset").map(a=>`<tr><td>${esc(a.name)}</td><td class="r">${fmt(a.balance)}</td></tr>`).join("")}
        <tr style="font-weight:700"><td>Total assets</td><td class="r">${fmt(sum("Asset"))}</td></tr></table></div>
      <div class="card"><h3>Liabilities</h3><table>${by("Liability").map(a=>`<tr><td>${esc(a.name)}</td><td class="r">${fmt(-a.balance)}</td></tr>`).join("")}
        <tr style="font-weight:700"><td>Total liabilities</td><td class="r">${fmt(-sum("Liability"))}</td></tr></table></div>
      <div class="card"><h3>Equity</h3><table>${by("Equity").map(a=>`<tr><td>${esc(a.name)}</td><td class="r">${fmt(-a.balance)}</td></tr>`).join("")}
        <tr><td>Current year profit</td><td class="r">${fmt(profit)}</td></tr>
        <tr style="font-weight:700"><td>Total equity</td><td class="r">${fmt(-sum("Equity")+profit)}</td></tr></table></div>
    </div>`;

  _rtab(el,id){ document.querySelectorAll(".tabs .t").forEach(t=>t.classList.remove("on")); el.classList.add("on");
    document.querySelectorAll(".rpane").forEach(p=>p.style.display="none"); document.getElementById(id).style.display=""; },

  /* ---- Users & access ---- */
  users(){
    const ago=t=>{ if(!t) return "never signed in"; const m=Math.round((Date.now()-Date.parse(t))/60000);
      return m<2?"active now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":new Date(t).toLocaleDateString("en-ZA"); };
    const nonBr=ALL_PERMS.filter(k=>!k.startsWith("br_"));
    const rows=Object.values(Store.profiles).sort((a,b)=>(b.is_owner-a.is_owner)||(b.active-a.active)||(a.full_name||"").localeCompare(b.full_name||""));
    const pend=Store.invites||[];
    return `<div class="banner">Each person gets their own <b>username and password</b> for Mecca Books — no claude.ai account needed. Tick exactly what they may do. The owner always has full access.</div>
    <div class="toolbar"><button class="btn p" onclick="Forms.addUser()">+ Add user</button>
      <span class="muted">${rows.filter(r=>r.active).length} active logins</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Last seen</th><th>Branches</th><th>Access</th><th></th></tr></thead><tbody>
    ${rows.map(r=>{ const pe=r.perms||{}, n=nonBr.filter(k=>pe[k]).length;
      const br=Object.keys(App.branches).filter(b=>pe["br_"+b]).map(b=>App.branches[b]);
      return `<tr style="${r.active?"":"opacity:.55"}"><td><b>${esc(r.full_name||r.username)}</b>${r.id===Store.uid?' <span class="muted">(you)</span>':""}</td>
      <td class="muted">${esc(r.username)}</td><td class="muted">${ago(r.last_seen)}</td>
      <td>${r.is_owner?"All":br.length?esc(br.join(", ")):'<span class="pill over">None</span>'}</td>
      <td>${r.is_owner?'<span class="pill paid">Owner — full access</span>':!r.active?'<span class="pill over">Login disabled</span>':n?`<span class="muted">${n} of ${nonBr.length} rights</span>`:'<span class="pill over">No access yet</span>'}</td>
      <td class="r" style="white-space:nowrap">${r.is_owner||r.id===Store.uid?"":`
        <button class="btn sm p" onclick="Forms.access('${r.id}')">Set access</button>
        <button class="btn sm" onclick="Forms.resetPw('${r.id}')">Reset password</button>
        <button class="btn sm ${r.active?"d":""}" onclick="Actions.toggleLogin('${r.id}')">${r.active?"Disable":"Enable"}</button>`}</td></tr>`;}).join("")}
    ${pend.map(v=>`<tr><td><b>${esc(v.full_name||v.username)}</b></td><td class="muted">${esc(v.username)}</td><td colspan="3"><span class="pill due">Invited — login not finished</span></td>
      <td class="r"><button class="btn sm d" onclick="Actions.cancelInvite('${esc(v.username)}')">Cancel</button></td></tr>`).join("")}
    </tbody></table></div>
    <p class="muted" style="font-size:12px;margin-top:10px">Disabling a login stops that person immediately on every device; their history stays in the audit trail.</p>`;
  },

  /* ---- Audit trail ---- */
  audit(){
    if(!Store._loaded.has("audit")){ Store.loadAudit(); return `<div class="empty">Loading audit trail…</div>`; }

    const NOUN={access:"User login / access",accounts:"Account",customers:"Customer",suppliers:"Supplier",items:"Stock item",documents:"Document",journals:"Journal",
      payments:"Payment / receipt",projects:"Project",banktxns:"Bank line",bankrules:"Bank rule",cashups:"Cash-up",settings:"Settings",transfers:"Stock transfer"};
    const sc=scope(), fu=App.auditUser||"", fa=App.auditAction||"", q=(App.auditQ||"").toLowerCase();
    let rows=Store.all("audit").sort((a,b)=>b.at-a.at);
    const users=[...new Set(rows.map(r=>r.by))];
    rows=rows.filter(r=>(sc==="ALL"||!r.branch||r.branch===sc)&&(!fu||r.by===fu)&&(!fa||r.action===fa)
      &&(!q||((r.label||"")+" "+(NOUN[r.coll]||r.coll)).toLowerCase().includes(q))).slice(0,500);
    const act={create:'<span class="pill paid">Created</span>',edit:'<span class="pill due">Edited</span>',delete:'<span class="pill over">Deleted</span>'};
    const when=t=>{const d=new Date(t);return d.toLocaleDateString("en-ZA")+" "+d.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit"});};
    return Views._scopeSel()+`<div class="toolbar">
      <select style="max-width:220px" onchange="App.auditUser=this.value;App.render()"><option value="">All users</option>
        ${users.map(u=>`<option value="${esc(u)}" ${u===fu?"selected":""} data-uid="${esc(u)}">${esc(Names.label(u))}</option>`).join("")}</select>
      <select style="max-width:160px" onchange="App.auditAction=this.value;App.render()"><option value="">All actions</option>
        ${["create","edit","delete"].map(a=>`<option value="${a}" ${a===fa?"selected":""}>${a==="create"?"Created":a==="edit"?"Edited":"Deleted"}</option>`).join("")}</select>
      <input class="search" placeholder="Search…" value="${esc(App.auditQ||"")}" onchange="App.auditQ=this.value;App.render()">
      <span class="muted">${rows.length} entries</span><button class="btn sm" onclick="Store.loadAudit()">↻ Refresh</button></div>
    ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>When</th><th>User</th><th>Branch</th><th>Action</th><th>What</th><th class="r">Amount</th><th>Changed</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td style="white-space:nowrap">${when(r.at)}</td><td>${Names.tag(r.by)}</td><td class="muted">${r.branch?App.branches[r.branch]||r.branch:"Both"}</td>
      <td>${act[r.action]||esc(r.action)}</td><td><b>${esc(NOUN[r.coll]||r.coll)}</b> ${esc(r.label||"")}</td>
      <td class="r">${r.amount!=null?fmt(r.amount):""}</td><td class="muted" style="font-size:12px">${esc((r.changed||[]).join(", "))}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">No activity recorded yet.</div>`}
    <p class="muted" style="font-size:12px;margin-top:10px">Entries are written by the database itself under each person's own login — nobody, including staff with full access, can edit or remove them.</p>`;
  },

    if(field==="price" && Forms._doc.lines[i].itemId && !can("editPrices")) return;
    if(field==="desc"){ Forms._doc.lines[i].desc=val;
      const it=Store.all("items").find(x=>x.name===val);
      if(it && (Forms._doc.lines[i].price==null||Forms._doc.lines[i].price==="")){
        const lv=Forms._docLevel(), pv=priceOf(it,lv);
        if(pv==null) toast("No "+Pricing().labels[lv]+" price on "+it.name+" — enter it manually");

        Forms.docRenderLines(); return; }
    } else Forms._doc.lines[i][field]=+val;
    Forms.docTotals();
    // update nett cell
    const row=document.querySelectorAll("#docLines tr")[i]; if(row) row.children[3].textContent=fmt((Forms._doc.lines[i].qty||0)*(Forms._doc.lines[i].price||0));

    document.getElementById("d_sub").textContent=fmt(sub);

  /* ---- Cash-up ---- */
  _cuDenoms:[
    {v:200,l:"R200 notes"},{v:100,l:"R100 notes"},{v:50,l:"R50 notes"},
    {v:20,l:"R20 notes"},{v:10,l:"R10 notes"},
    {v:5,l:"R5 coins"},{v:2,l:"R2 coins"},{v:1,l:"R1 coins"},
    {v:0.5,l:"50c coins"},{v:0.2,l:"20c coins"},{v:0.1,l:"10c coins"}

  cashup(expected){
    const rows=Forms._cuDenoms.map((d,i)=>`<tr>
      <td>${d.l}</td>
      <td style="width:90px"><input type="number" min="0" step="1" id="cu_${i}" value="0" style="text-align:right" oninput="Forms.cuCalc(${expected})"></td>
      <td class="r" style="width:120px" id="cuv_${i}">R 0.00</td></tr>`).join("");
    modal(`<span class="close" onclick="closeModal()">✕</span><h2>Daily cash-up — ${App.branches[App.branch]}</h2>
      <div class="banner">Count every SA denomination in the till for <b>${App.branches[App.branch]}</b>. Expected cash today: <b>${fmt(expected)}</b></div>
      <table class="linetbl"><thead><tr><th>Denomination</th><th class="r">Count</th><th class="r">Value</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="totbox" style="max-width:none">
        <div class="tr"><span>Cash counted</span><b id="cu_counted_v">R 0.00</b></div>
        <div class="tr"><span>Expected in till</span><span>${fmt(expected)}</span></div>
        <div class="tr g"><span>Variance (over / short)</span><b id="cu_var">${fmt(-expected)}</b></div>
      </div>
      <div class="f" style="margin-top:12px"><label>Note</label><input id="cu_note" placeholder="e.g. float R500 included, R20 short"></div>
      <button class="btn p" onclick="Actions.saveCashup(${expected})">Close cash-up</button>`);
  },
  cuCalc(expected){
    let total=0;
    Forms._cuDenoms.forEach((d,i)=>{
      const q=Math.max(0,+document.getElementById("cu_"+i).value||0);
      const val=money(q*d.v); total+=val;
      document.getElementById("cuv_"+i).textContent=fmt(val);
    });
    total=money(total);
    document.getElementById("cu_counted_v").textContent=fmt(total);
    const vEl=document.getElementById("cu_var"); const vr=money(total-expected);
    vEl.textContent=fmt(vr);
    vEl.style.color = Math.abs(vr)<0.01?"var(--good)":(vr<0?"var(--bad)":"var(--warn)");
  },

  async saveItem(id){
    const g=x=>document.getElementById(x).value;
    if(!g("i_name")){toast("Description required");return;}
    const el=x=>document.getElementById(x);
    const old=id?Store.get("items",id):{};
    const stock={...stockOf(old)};
    Object.keys(App.branches).forEach(k=>{ if(el("i_qty_"+k)) stock[k]=+el("i_qty_"+k).value||0; });
    const cost = el("i_cost") ? +el("i_cost").value||0 : (+old.cost||0);
    let pcts=pctsOf(old), prices=pricesOf(old);
    if(can("editPrices")){
      pcts=[]; prices=[];
      for(let l=0;l<6;l++){
        const pr=el("i_pr_"+l).value; prices.push(pr!==""?money(+pr):null);
        if(el("i_pct_"+l)){ const pc=el("i_pct_"+l).value; pcts.push(pc!==""?+pc:null); }
        else pcts.push(pr!==""?pctFrom(cost,+pr):null);   // no cost rights: keep % in step with the price typed
      }
    }
    const rec={...old,id:id||undefined,code:g("i_code"),name:g("i_name"),cost,pcts,prices,price:prices[0],stock,bin:g("i_bin")};
    if(!id && !can("editPrices")) repriceItem(rec);   // new item by someone who can't set prices: use default %
    delete rec.markup; delete rec.qty;
    await Store.put("items",rec);
    closeModal();toast("Item saved");
  },

    if(!g("p_name")){toast("Name required");return;}

  async delRec(coll,id){ if(await Store.del(coll,id)===false) return; closeModal(); toast("Deleted"); },

  async saveDocument(id,convert){
    const g=x=>document.getElementById(x).value;
    const d=Forms._doc;
    d.customerId=g("d_cust"); d.projectId=g("d_project"); d.date=g("d_date"); d.branch=g("d_branch");
    d.type=convert?"invoice":g("d_type");
    d.lines=d.lines.filter(l=>l.desc&&(l.qty||l.price));
    if(!d.customerId){toast("Select a customer");return;}
    if(!inBranch(Store.get("customers",d.customerId)||{},d.branch)){toast("That customer belongs to the other branch");return;}
    if(!d.lines.length){toast("Add at least one line");return;}
    if(d.type==="invoice" && !Post.ensure(d.branch,[ACC.debtors,ACC.salesInv,ACC.vatOut,ACC.cos,ACC.stock])) return;
    d.sub=money(d.lines.reduce((s,l)=>s+(l.qty||0)*(l.price||0),0));
    d.vat=money(d.sub*VAT_RATE); d.total=money(d.sub+d.vat);
    const wasQuote = id?((Store.get("documents",id)||{}).type==="quote"):true;
    if(!d.no){ d.no = d.type==="invoice"?await nextNo("invoice","INV",6,d.branch):await nextNo("quote","QU",6,d.branch); }
    if(convert && wasQuote){ d.quoteNo=d.no; d.no=await nextNo("invoice","INV",6,d.branch); }
    d.id=id||d.id;
    const saved=await Store.put("documents",d);
    // post to GL only for invoices (and only once)
    if(d.type==="invoice" && !saved.posted){
      await Actions._postInvoice(saved);
      saved.posted=true; await Store.put("documents",saved);
    }
    closeModal(); toast(d.type==="invoice"?"Invoice saved & posted":"Quote saved"); App.go("documents");
  },
  async convertToInvoice(id){ await Actions.saveDocument(id,true); },
  async _postInvoice(d){
    const cust=Store.get("customers",d.customerId);
    const lines=[
      {account:ACC.debtors,debit:d.total,credit:0},
      {account:ACC.salesInv,debit:0,credit:d.sub},
      {account:ACC.vatOut,debit:0,credit:d.vat}
    ];
    // cost of sales + stock reduction
    let cos=0;
    d.lines.forEach(l=>{ if(l.itemId){ const it=Store.get("items",l.itemId); if(it){ cos+=money((it.cost||0)*(l.qty||0));
      addQty(it,d.branch||App.branch,-(l.qty||0)); Store.put("items",it); } }});
    if(cos>0){ lines.push({account:ACC.cos,debit:cos,credit:0}); lines.push({account:ACC.stock,debit:0,credit:cos}); }
    await Post.journal({source:"invoice",ref:d.no,memo:"Invoice "+(cust?cust.name:""),date:d.date,branch:d.branch,
      projectId:d.projectId, party:{kind:"customer",id:d.customerId}, lines});
  },

  async saveBill(){
    const g=x=>document.getElementById(x).value;
    const sup=g("b_sup"); if(!sup){toast("Select supplier");return;}
    if(!Post.ensure(App.branch,[g("b_acc"),ACC.vatIn,ACC.creditors])) return;
    const sub=money(+g("b_amt")); if(!sub){toast("Enter amount");return;}
    const addVat=g("b_vat")==="1"; const vat=addVat?money(sub*VAT_RATE):0; const total=money(sub+vat);
    const no=await nextNo("bill","BILL",6,App.branch);
    const f=document.getElementById("b_cam").files[0]||document.getElementById("b_file").files[0];
    const attachment = f ? await Actions._uploadAttachment(f,App.branch) : null;
    const d={id:undefined,type:"bill",no,ref:g("b_ref"),date:g("b_date"),supplierId:sup,sub,vat,total,paid:0,acc:g("b_acc"),projectId:g("b_project"),attachment,branch:App.branch};
    const saved=await Store.put("documents",d);
    const lines=[{account:g("b_acc"),debit:sub,credit:0}];
    if(vat) lines.push({account:ACC.vatIn,debit:vat,credit:0});
    lines.push({account:ACC.creditors,debit:0,credit:total});
    await Post.journal({source:"bill",ref:no,memo:"Bill "+(Store.get("suppliers",sup)||{}).name,date:g("b_date"),
      projectId:g("b_project"), party:{kind:"supplier",id:sup}, lines});
    closeModal();toast("Bill recorded & posted");
  },

  /* ---- 📎 Invoice attachments (stored in the app's file storage) ---- */
  async _uploadAttachment(file,branch){
    try{
      let blob=file;
      if(file.type && file.type.startsWith("image/") && file.size>600000) blob=await Actions._shrinkImage(file,2000);
      const type=blob.type||file.type||"application/octet-stream";
      const ext=/pdf/.test(type)?"pdf":/png/.test(type)?"png":"jpg";
      const path=(branch||App.branch)+"/"+new Date().toISOString().slice(0,7)+"-"+uid()+"."+ext;
      const { error } = await Store.client().storage.from("invoices").upload(path,blob,{contentType:type});
      if(error) throw error;
      return {path,type,size:blob.size||0};
    }catch(e){
      toast("Bill saved — invoice image could not be stored ("+niceErr(e)+")");
      return null;
    }
  },
  async attachToBill(docId,file){
    if(!file) return;
    const d=Store.get("documents",docId); if(!d) return;
    toast("Uploading invoice…");
    const att=await Actions._uploadAttachment(file,recBranch(d));
    if(!att) return;
    d.attachment=att; await Store.put("documents",d);
    toast("Invoice attached to "+d.no);
  },

  _shrinkImage(file,max){
    return new Promise(res=>{
      const img=new Image(), u=URL.createObjectURL(file);
      img.onload=()=>{
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(u);
        c.toBlob(b=>res(b||file),"image/jpeg",0.85);
      };
      img.onerror=()=>{ URL.revokeObjectURL(u); res(file); };
      img.src=u;
    });
  },
  async savePayment(kind){
    const g=x=>document.getElementById(x).value;
    const amt=money(+g("pay_amt")); if(!amt){toast("Enter amount");return;}
    const acc=g("pay_acc"), via=g("pay_via"), proj=g("pay_project");
    const inclVat=document.getElementById("pay_vat").checked;
    const vat=inclVat?money(amt-amt/(1+VAT_RATE)):0, net=money(amt-vat);
    if(!Post.ensure(App.branch,[acc,via,vat?(kind==="receipt"?ACC.vatOut:ACC.vatIn):null])) return;
    const p={id:undefined,kind,date:g("pay_date"),ref:g("pay_ref"),who:g("pay_who"),account:acc,via,amount:amt,projectId:proj,branch:App.branch};
    await Store.put("payments",p);
    let lines;
    if(kind==="receipt"){
      lines=[{account:via,debit:amt,credit:0}];
      if(vat){ lines.push({account:acc,debit:0,credit:net}); lines.push({account:ACC.vatOut,debit:0,credit:vat}); }
      else lines.push({account:acc,debit:0,credit:amt});
    }else{
      lines=[{account:via,debit:0,credit:amt}];
      if(vat){ lines.push({account:acc,debit:net,credit:0}); lines.push({account:ACC.vatIn,debit:vat,credit:0}); }
      else lines.push({account:acc,debit:amt,credit:0});
    }
    await Post.journal({source:kind,ref:g("pay_ref"),memo:(kind==="receipt"?"Receipt ":"Payment ")+g("pay_who"),
      date:g("pay_date"),projectId:proj,lines});
    closeModal();toast(kind==="receipt"?"Receipt saved":"Payment saved");
  },

  async posPay(method){
    if(!App.cart.length)return;
    if(!Post.ensure(App.branch,[ACC.bank,ACC.till,ACC.salesPOS,ACC.vatOut,ACC.cos,ACC.stock])) return;
    const sub=money(App.cart.reduce((s,l)=>s+l.qty*l.price,0)), vat=money(sub*VAT_RATE), tot=money(sub+vat);
    const no=await nextNo("pos","POS",6,App.branch);
    const bankAcc = ACC.bank;
    const debitAcc = method==="cash"?ACC.till:bankAcc;
    const lines=[{account:debitAcc,debit:tot,credit:0},{account:ACC.salesPOS,debit:0,credit:sub},{account:ACC.vatOut,debit:0,credit:vat}];
    let cos=0;
    App.cart.forEach(l=>{ if(l.itemId){ const it=Store.get("items",l.itemId); if(it){ cos+=money((it.cost||0)*l.qty); addQty(it,App.branch,-l.qty); Store.put("items",it);}}});
    if(cos>0){ lines.push({account:ACC.cos,debit:cos,credit:0}); lines.push({account:ACC.stock,debit:0,credit:cos}); }
    await Post.journal({source:"pos",ref:no,memo:"POS sale ("+method+")",date:today(),branch:App.branch,lines});
    App.cart=[]; toast("Sale "+no+" — "+fmt(tot)+" ("+method+")"); App.render();
  },

  async saveCashup(expected){
    let counted=0; const breakdown={};
    Forms._cuDenoms.forEach((d,i)=>{ const q=Math.max(0,+document.getElementById("cu_"+i).value||0);
      if(q){ breakdown[d.v]=q; counted+=q*d.v; } });
    counted=money(counted);
    await Store.put("cashups",{id:undefined,date:today(),branch:App.branch,expected,counted,
      variance:money(counted-expected),breakdown,note:document.getElementById("cu_note").value});
    closeModal();toast("Cash-up closed"); App.render();
  },

  async importBank(){
    const txt=document.getElementById("bk_text").value.trim();
    const acc=document.getElementById("bk_acc").value;
    if(!txt){toast("Nothing to import");return;}
    const rows=txt.split(/\r?\n/).filter(r=>r.trim());
    let n=0, start=0;
    if(/date/i.test(rows[0])&&/amount|desc/i.test(rows[0])) start=1;
    for(let i=start;i<rows.length;i++){
      const parts=Actions._csvSplit(rows[i]); if(parts.length<3)continue;
      const date=parts[0].trim(), desc=parts.slice(1,-1).join(" ").trim(), amount=money(parseFloat(parts[parts.length-1].replace(/[^0-9.\-]/g,"")));
      if(isNaN(amount))continue;
      await Store.put("banktxns",{id:undefined,date,desc,amount,bankAccount:acc,allocated:false,branch:App.branch});
      n++;
    }
    closeModal(); toast(n+" lines imported"); App.go("bank"); Actions.autoAllocate(true);
  },
  _csvSplit(line){ // handle quoted commas
    const out=[];let cur="",q=false;
    for(const ch of line){ if(ch==='"'){q=!q;} else if(ch===","&&!q){out.push(cur);cur="";} else cur+=ch; }
    out.push(cur); return out;
  },
  async autoAllocate(silent){
    const rules=Store.all("bankrules").filter(r=>inBranch(r)); let n=0;
    for(const t of Store.all("banktxns").filter(t=>inBranch(t))){
      if(t.allocated)continue;
      const r=rules.find(r=>t.desc.toLowerCase().includes(r.kw.toLowerCase()));
      if(r){ await Actions._postBankTxn(t,r.account,r.vat,r.projectId); n++; }
    }
    if(!silent) toast(n?(n+" lines auto-allocated"):"No matching rules — allocate manually once to teach it");
    App.render();
  },
  async allocateTxn(txnId){
    const t=Store.get("banktxns",txnId); if(!t)return;
    const acc=document.getElementById("al_acc").value;
    const vat=document.getElementById("al_vat").checked;
    const proj=document.getElementById("al_project").value;
    if(document.getElementById("al_rule").checked){
      await Store.put("bankrules",{id:undefined,branch:recBranch(t),kw:Forms._alKw,account:acc,vat,projectId:proj});
    }
    await Actions._postBankTxn(t,acc,vat,proj);
    closeModal();toast("Allocated & posted");
  },
  async _postBankTxn(t,acc,inclVat,proj){
    const bank=t.bankAccount;
    if(!Post.ensure(recBranch(t),[bank,acc,inclVat?(t.amount<0?ACC.vatIn:ACC.vatOut):null])) return false;
    const amt=Math.abs(t.amount);
    const vat=inclVat?money(amt-amt/(1+VAT_RATE)):0, net=money(amt-vat);
    let lines;
    if(t.amount<0){ // money out
      lines=[{account:bank,debit:0,credit:amt}];
      if(vat){ lines.push({account:acc,debit:net,credit:0}); lines.push({account:ACC.vatIn,debit:vat,credit:0}); }
      else lines.push({account:acc,debit:amt,credit:0});
    }else{ // money in
      lines=[{account:bank,debit:amt,credit:0}];
      if(vat){ lines.push({account:acc,debit:0,credit:net}); lines.push({account:ACC.vatOut,debit:0,credit:vat}); }
      else lines.push({account:acc,debit:0,credit:amt});
    }
    await Post.journal({source:"bank",ref:"BANK",memo:t.desc,date:t.date,branch:t.branch,projectId:proj,lines});
    t.allocated=true; t.account=acc; await Store.put("banktxns",t);
  },

  async saveTransfer(){
    const t=Forms._tf; if(!t) return;
    if(!can("transfer")||!can("br_"+t.from)||!can("br_"+t.to)){ toast("You need transfer rights and access to both branches"); return; }
    const lines=t.lines.filter(l=>l.itemId&&(+l.qty)>0);
    if(!lines.length){ toast("Pick at least one item and quantity"); return; }
    for(const l of lines){ const it=Store.get("items",l.itemId);
      if(qtyOf(it,t.from) < +l.qty){ toast("Only "+qtyOf(it,t.from)+" × "+it.name+" in "+App.branches[t.from]); return; } }
    if(!Post.ensure(t.from,[ACC.stock,ACC.interBranch]) || !Post.ensure(t.to,[ACC.stock,ACC.interBranch])) return;
    const date=document.getElementById("tf_date").value||today(), note=document.getElementById("tf_ref").value;
    let value=0;
    for(const l of lines){ const it=Store.get("items",l.itemId);
      value+=money((+l.qty)*(+it.cost||0)); addQty(it,t.from,-(+l.qty)); addQty(it,t.to,+l.qty); await Store.put("items",it); }
    value=money(value);
    const no=await nextNo("transfer","TRF",6,t.from);
    const memo="Stock transfer "+App.branches[t.from]+" → "+App.branches[t.to]+(note?" · "+note:"");
    if(value>0){
      await Post.journal({source:"transfer",ref:no,memo,date,branch:t.from,
        lines:[{account:ACC.interBranch,debit:value,credit:0},{account:ACC.stock,debit:0,credit:value}]});
      await Post.journal({source:"transfer",ref:no,memo,date,branch:t.to,
        lines:[{account:ACC.stock,debit:value,credit:0},{account:ACC.interBranch,debit:0,credit:value}]});
    }
    await Store.put("transfers",{no,date,from:t.from,to:t.to,note,value,branch:t.from,
      lines:lines.map(l=>{const it=Store.get("items",l.itemId);return {itemId:l.itemId,code:it.code||"",name:it.name,qty:+l.qty,cost:+it.cost||0};})});
    closeModal(); toast(no+": "+lines.length+" item(s) moved to "+App.branches[t.to]+" — "+fmt(value)); App.render();
  },

  async saveJournal(){
    const g=x=>document.getElementById(x).value;
    const lines=Forms._jl.filter(l=>l.account&&((+l.debit)||(+l.credit)));
    if(lines.length<2){toast("Need at least two lines");return;}
    try{
      await Post.journal({source:"manual",ref:g("j_ref"),memo:g("j_memo"),date:g("j_date"),
        projectId:g("j_project"),lines:lines.map(l=>({account:l.account,debit:+l.debit||0,credit:+l.credit||0}))});
      closeModal();toast("Journal posted");
    }catch(e){/* toast already shown */}
  },

  async exportJSON(){
    const blob=JSON.stringify(Store.data,null,2);
    Actions._download("meccabooks-backup-"+today()+".json",blob);
  },
  async exportCSV(coll){
    const rows=Store.all(coll);
    if(coll==="journals"){
      let csv="Date,Ref,Memo,Account,Debit,Credit,Branch,Source\n";
      rows.forEach(j=>(j.lines||[]).forEach(l=>{csv+=`${j.date},${j.ref||''},"${(j.memo||'').replace(/"/g,'')}",${l.account},${l.debit||0},${l.credit||0},${j.branch||''},${j.source||''}\n`;}));
      Actions._download("journals-"+today()+".csv",csv);
    }
  },
  _download(name,content){
    // sandbox blocks <a download>; offer copy fallback
    try{ const b=new Blob([content],{type:"text/plain"}); const u=URL.createObjectURL(b);
      const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),2000);
    }catch(e){}
    navigator.clipboard?.writeText(content).then(()=>toast("Copied to clipboard (download may be blocked in-frame)")).catch(()=>toast("Export ready"));
  }
};

/* ---- cart helpers ---- */
App.getPosLevel=function(){ return (App.posLevel!=null && can("editPrices")) ? App.posLevel : Pricing().posLevel; };
App.cartAdd=function(itemId,level){ const it=Store.get("items",itemId); if(!it)return;
  const lv=(level!=null&&can("editPrices")?level:App.getPosLevel()), pr=priceOf(it,lv);
  if(pr==null){ toast("No "+Pricing().labels[lv]+" price set for "+it.name); return; }
  const ex=App.cart.find(l=>l.itemId===itemId&&(l.level||0)===lv);
  if(ex)ex.qty++; else App.cart.push({itemId,name:it.name,price:pr,level:lv,qty:1}); App.render(); };
App.cartQty=function(i,v){ App.cart[i].qty=Math.max(1,+v||1); App.render(); };
App.cartDel=function(i){ App.cart.splice(i,1); App.render(); };

/* ============================================================
   AUTH — own Mecca Books usernames & passwords (no claude.ai needed)
   ============================================================ */
const Auth = {
  _screen(html){
    let el=document.getElementById("authScreen");
    if(!el){ el=document.createElement("div"); el.id="authScreen"; document.body.appendChild(el); }
    el.innerHTML=`<div class="authbox"><div class="brand" style="border:0;padding:0 0 14px"><b>Mecca Books</b><small>The Security Mecca · Accounting</small></div>${html}</div>`;
    el.style.display="flex";
  },
  hide(){ const el=document.getElementById("authScreen"); if(el) el.style.display="none"; },
  show(msg){
    this._screen(`<h2 style="margin:0 0 14px;font-size:18px">Sign in</h2>
      ${msg?`<div class="banner">${esc(msg)}</div>`:""}
      <form onsubmit="event.preventDefault();Auth.signIn()">
        <div class="f"><label>Username</label><input id="au_user" autocomplete="username" autocapitalize="none" autofocus></div>
        <div class="f"><label>Password</label><input id="au_pass" type="password" autocomplete="current-password"></div>
        <button class="btn p" style="width:100%;padding:11px" id="au_btn">Sign in</button>
      </form>
      <div id="au_err" style="color:var(--bad);margin-top:10px;min-height:18px"></div>
      <p class="muted" style="font-size:12px;margin-top:14px">Forgot your password? Ask the owner to reset it under Users &amp; Access.<br>
      Setting up for the first time? <a onclick="Auth.ownerSetup()" style="cursor:pointer">Create the owner login</a></p>`);
  },
  async signIn(){
    const u=document.getElementById("au_user").value, pw=document.getElementById("au_pass").value;
    const btn=document.getElementById("au_btn"), err=document.getElementById("au_err");
    if(!u||!pw){ err.textContent="Enter your username and password"; return; }
    btn.disabled=true; btn.textContent="Signing in…"; err.textContent="";
    const { error } = await Store.client().auth.signInWithPassword({email:toEmail(u), password:pw});
    if(error){ btn.disabled=false; btn.textContent="Sign in"; err.textContent="Can't sign in: "+niceErr(error); return; }
    reloadApp();
  },
  ownerSetup(){
    this._screen(`<h2 style="margin:0 0 8px;font-size:18px">Create the owner login</h2>
      <p class="muted" style="font-size:13px">Only works once, for the owner username set in the database setup (normally <b>vivian</b>).</p>
      <form onsubmit="event.preventDefault();Auth.createOwner()">
        <div class="f"><label>Owner username</label><input id="ow_user" value="vivian" autocapitalize="none"></div>
        <div class="f"><label>Your name</label><input id="ow_name" value="Vivian Lohrmann"></div>
        <div class="f"><label>Choose a password (at least 8 characters)</label><input id="ow_pass" type="password" autocomplete="new-password"></div>
        <div class="f"><label>Repeat password</label><input id="ow_pass2" type="password" autocomplete="new-password"></div>
        <button class="btn p" style="width:100%;padding:11px">Create owner login</button>
      </form>
      <div id="au_err" style="color:var(--bad);margin-top:10px;min-height:18px"></div>
      <p style="font-size:12px"><a onclick="Auth.show()" style="cursor:pointer">← Back to sign in</a></p>`);
  },
  async createOwner(){
    const g=x=>document.getElementById(x).value, err=document.getElementById("au_err");
    const u=normUser(g("ow_user")), pw=g("ow_pass");
    if(pw.length<8){ err.textContent="Use at least 8 characters"; return; }
    if(pw!==g("ow_pass2")){ err.textContent="The passwords don't match"; return; }
    const r=await Store.client().auth.signUp({email:toEmail(u), password:pw, options:{data:{full_name:g("ow_name")}}});
    if(r.error){ err.textContent="Not created: "+niceErr(r.error); return; }
    if(!r.data.session){
      err.textContent="Login created, but Supabase wants an email confirmation. In Supabase: Authentication → Sign In / Providers → Email → turn OFF 'Confirm email', then sign in.";
      return;
    }
    reloadApp();
  },
  blocked(){
    this._screen(`<h2 style="margin:0 0 10px;font-size:18px">Login not active</h2>
      <p>This login has been disabled or isn't set up yet. Ask the owner to check it under Users &amp; Access.</p>
      <button class="btn" onclick="Auth.signOut()">Sign out</button>`);
  },
  async signOut(){ try{ await Store.client().auth.signOut(); }catch(e){} reloadApp(); },
  changePassword(){
    modal(`<span class="close" onclick="closeModal()">✕</span><h2>Change your password</h2>
      <div class="f"><label>New password (at least 8 characters)</label><input id="cp_1" type="password" autocomplete="new-password"></div>
      <div class="f"><label>Repeat new password</label><input id="cp_2" type="password" autocomplete="new-password"></div>
      <button class="btn p" onclick="Auth.savePassword()">Save password</button>`);
  },
  async savePassword(){
    const a=document.getElementById("cp_1").value, b=document.getElementById("cp_2").value;
    if(a.length<8){ toast("Use at least 8 characters"); return; }
    if(a!==b){ toast("The passwords don't match"); return; }
    const { error } = await Store.client().auth.updateUser({password:a});
    if(error){ toast("Not changed — "+niceErr(error)); return; }
    closeModal(); toast("Password changed");
  },
  // sign out automatically after a spell of no activity (shared till PCs)
  watchIdle(){
    let last=Date.now();
    ["click","keydown","touchstart","mousemove"].forEach(ev=>document.addEventListener(ev,()=>{ last=Date.now(); },{passive:true}));
    setInterval(()=>{
      const mins=+((Store.get("settings","security")||{}).idleMinutes ?? 30);
      if(mins>0 && Date.now()-last > mins*60000) Auth.signOut();
    }, 30000);
  }
};

function reloadApp(){ location.reload(); }
async function boot(){
  if(!CFG.url || !CFG.anonKey || /YOUR-/.test(CFG.url+CFG.anonKey)){
    Auth._screen(`<h2 style="font-size:18px">Not connected yet</h2><p>Fill in your Supabase details in <b>config.js</b> (see SETUP guide, step 3).</p>`); return;
  }
  if(!window.supabase){ Auth._screen(`<p>Couldn't load the app files. Check your internet connection and reload.</p>`); return; }
  const { data:{ session } } = await Store.client().auth.getSession();
  if(!session){ Auth.show(); return; }
  try{ if(await App.start()!==false) Auth.hide(); }
  catch(e){ console.error(e); Auth.show("Please sign in again."); }
  Store.client().auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT") reloadApp(); });
}
window.addEventListener("DOMContentLoaded",boot);
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
